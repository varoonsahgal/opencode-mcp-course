<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Module 3, Build: a few lines of TypeScript become a tool the model can read, choose and call">
  <title>Module 3 · Build</title>
  <style>
    .ln { animation: type 7s ease-out infinite backwards; }
    .seg { animation: seg 7s steps(1) infinite backwards; }
    .card { animation: card 7s ease-out infinite backwards; animation-delay: 2.2s; }
    .arrow { stroke-dasharray: 4 6; animation: flow 1.2s linear infinite; }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes type { 0% { opacity: 0; } 6% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes seg { 0% { opacity: .15; } 4% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: .15; } }
    @keyframes card { 0% { opacity: .25; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: .25; } }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b17"/><stop offset="1" stop-color="#1c1407"/></linearGradient>
    <radialGradient id="glow3" cx="0.74" cy="0.5" r="0.45"><stop offset="0" stop-color="#f59e0b" stop-opacity=".28"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <pattern id="grid3" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1e293b" stroke-width="1"/></pattern>
    <linearGradient id="title3" x1="0" x2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
  </defs>

  <rect width="960" height="220" rx="20" fill="url(#bg3)"/>
  <rect width="960" height="220" rx="20" fill="url(#grid3)" opacity=".55"/>
  <rect width="960" height="220" rx="20" fill="url(#glow3)"/>

  <!-- left: words -->
  <text x="40" y="50" font-family="Menlo, 'JetBrains Mono', monospace" font-size="12" letter-spacing="1.8" fill="#fbbf24">MODULE 03 · 55 MIN · LAB: lab3-weather-server</text>
  <text x="38" y="102" font-size="46" font-weight="800" fill="url(#title3)" letter-spacing="-1">Build</text>
  <text x="40" y="134" font-size="17" fill="#cbd5e1">The model never sees your code. It reads your words.</text>
  <text x="40" y="156" font-size="17" fill="#cbd5e1">Write them well and it <tspan fill="#fde68a" font-weight="700">picks your tool by itself.</tspan></text>
  <g font-size="12" font-weight="700">
    <rect x="40"  y="176" width="128" height="26" rx="13" fill="#d97706" fill-opacity=".18" stroke="#fbbf24"/><text x="104" y="193" text-anchor="middle" fill="#fde68a">a real API as a tool</text>
    <rect x="176" y="176" width="112" height="26" rx="13" fill="#d97706" fill-opacity=".18" stroke="#fbbf24"/><text x="232" y="193" text-anchor="middle" fill="#fde68a">errors it recovers</text>
    <rect x="296" y="176" width="92"  height="26" rx="13" fill="#d97706" fill-opacity=".18" stroke="#fbbf24"/><text x="342" y="193" text-anchor="middle" fill="#fde68a">score 10/10</text>
  </g>

  <!-- right: code assembles -->
  <rect x="486" y="28" width="236" height="164" rx="12" fill="#0b0f1a" stroke="#334155"/>
  <circle cx="502" cy="42" r="4" fill="#ff5f57"/><circle cx="516" cy="42" r="4" fill="#febc2e"/><circle cx="530" cy="42" r="4" fill="#28c840"/>
  <text x="704" y="45" text-anchor="end" font-family="Menlo, 'JetBrains Mono', monospace" font-size="9" fill="#64748b">server.ts</text>
  <g font-family="Menlo, 'JetBrains Mono', monospace" font-size="10">
    <text class="ln" style="animation-delay:0s"   x="500" y="70"><tspan fill="#c4b5fd">server</tspan><tspan fill="#94a3b8">.</tspan><tspan fill="#fbbf24">registerTool</tspan><tspan fill="#94a3b8">(</tspan></text>
    <text class="ln" style="animation-delay:.3s"  x="512" y="86" fill="#86efac">"get_weather",</text>
    <text class="ln" style="animation-delay:.6s"  x="512" y="102"><tspan fill="#93c5fd">description</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"Use this</tspan></text>
    <text class="ln" style="animation-delay:.8s"  x="524" y="116" fill="#86efac">whenever… Not a forecast"</text>
    <text class="ln" style="animation-delay:1.1s" x="512" y="132"><tspan fill="#93c5fd">inputSchema</tspan><tspan fill="#94a3b8">: z.object({</tspan></text>
    <text class="ln" style="animation-delay:1.4s" x="524" y="146"><tspan fill="#fde68a">city</tspan><tspan fill="#94a3b8">: z.string().</tspan><tspan fill="#fbbf24">min</tspan><tspan fill="#94a3b8">(2)</tspan></text>
    <text class="ln" style="animation-delay:1.7s" x="512" y="162"><tspan fill="#93c5fd">annotations</tspan><tspan fill="#94a3b8">: { readOnly… }</tspan></text>
    <text class="ln" style="animation-delay:2.0s" x="500" y="180" fill="#94a3b8">}, handler)<tspan class="caret" fill="#fbbf24">▍</tspan></text>
  </g>

  <path class="arrow" d="M728 110 H752" stroke="#fbbf24" stroke-width="2" fill="none"/>
  <path d="M750 104 L758 110 L750 116 z" fill="#fbbf24"/>

  <!-- right: the tool card the model sees -->
  <g class="card">
    <rect x="764" y="40" width="168" height="140" rx="12" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
    <text x="778" y="62" font-family="Menlo, 'JetBrains Mono', monospace" font-size="9" letter-spacing="1.5" fill="#94a3b8">THE MODEL SEES</text>
    <text x="778" y="84" font-family="Menlo, 'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#5eead4">weather_get_weather</text>
    <rect x="778" y="96"  width="140" height="5" rx="2.5" fill="#334155"/>
    <rect x="778" y="106" width="118" height="5" rx="2.5" fill="#334155"/>
    <rect x="778" y="116" width="128" height="5" rx="2.5" fill="#334155"/>
    <text x="778" y="140" font-family="Menlo, 'JetBrains Mono', monospace" font-size="10" fill="#fde68a">city<tspan fill="#94a3b8">: string 2..80</tspan></text>
  </g>
  <g fill="#fbbf24">
    <rect class="seg" style="animation-delay:2.5s"  x="778" y="154" width="10" height="12" rx="2"/>
    <rect class="seg" style="animation-delay:2.65s" x="791" y="154" width="10" height="12" rx="2"/>
    <rect class="seg" style="animation-delay:2.8s"  x="804" y="154" width="10" height="12" rx="2"/>
    <rect class="seg" style="animation-delay:2.95s" x="817" y="154" width="10" height="12" rx="2"/>
    <rect class="seg" style="animation-delay:3.1s"  x="830" y="154" width="10" height="12" rx="2"/>
    <rect class="seg" style="animation-delay:3.25s" x="843" y="154" width="10" height="12" rx="2"/>
    <rect class="seg" style="animation-delay:3.4s"  x="856" y="154" width="10" height="12" rx="2"/>
    <rect class="seg" style="animation-delay:3.55s" x="869" y="154" width="10" height="12" rx="2" fill="#4ade80"/>
    <rect class="seg" style="animation-delay:3.7s"  x="882" y="154" width="10" height="12" rx="2" fill="#4ade80"/>
    <rect class="seg" style="animation-delay:3.85s" x="895" y="154" width="10" height="12" rx="2" fill="#4ade80"/>
  </g>
</svg>
