<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Three-panel comic: a skeleton presents a token addressed to the payroll vault and the pumpkin desk turns it away; Alice asks the witch for deploy scope and is told she is entitled to read only; a ghost picks up a refresh token from the floor and the witch revokes the whole login.">
<title>Panel 1: Bob the skeleton shows a sealed token to the pumpkin desk. Bob: Signed by the witch. Says I'm Bob. Desk: The seal is real. It is addressed to the payroll vault. Not to me. Panel 2: Alice the skeleton at the witch's window. Alice: The desk says come back with releases:deploy. Witch: You are entitled to read. Nobody can change that from a config file. Panel 3: a ghost holds a refresh token found on the floor labelled tokens.local.json. Witch: This one was already used. Everything from that login is revoked. Caption: A token says who, for what, until when. Check all three, and burn the long-lived one every time you use it.</title>
