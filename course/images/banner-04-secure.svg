<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Module 4, Securing MCP: a five-link trust chain from user to external system, with the server link cracking under a DELETE statement">
 <title>Module 4 · Securing MCP integrations</title>
 <style>
  .b4-tw { animation: b4-tw 3.2s ease-in-out infinite; }
  .b4-fly { animation: b4-fly 6s ease-in-out infinite; }
  .b4-flk { animation: b4-flk 3.1s steps(1) infinite; }
  .b4-flow { stroke-dasharray: 4 10; animation: b4-flow 1.4s linear infinite; }
  .b4-blink { animation: b4-blink 1.8s steps(1) infinite; }
  .b4-halo { animation: b4-halo 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .b4-crack { stroke-dasharray: 60; stroke-dashoffset: 60; animation: b4-crack 3.6s ease-in infinite; }
  @keyframes b4-tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
  @keyframes b4-fly { 0%,100% { transform: translate(0,0) rotate(0); } 50% { transform: translate(12px,-7px) rotate(-8deg); } }
  @keyframes b4-flk { 0%,64% { opacity: 1; } 65%,70% { opacity: .3; } 71%,78% { opacity: 1; } 79%,82% { opacity: .4; } 83%,100% { opacity: 1; } }
  @keyframes b4-flow { to { stroke-dashoffset: -28; } }
  @keyframes b4-blink { 0%,55% { opacity: 1; } 56%,100% { opacity: .3; } }
  @keyframes b4-halo { 0% { opacity: .6; transform: scale(.95); } 100% { opacity: 0; transform: scale(1.35); } }
  @keyframes b4-crack { 0%,30% { stroke-dashoffset: 60; } 55%,100% { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .b4-tw, .b4-fly, .b4-flk, .b4-flow, .b4-blink, .b4-halo, .b4-crack { animation: none !important; } .b4-crack { stroke-dashoffset: 0; } }
 </style>
