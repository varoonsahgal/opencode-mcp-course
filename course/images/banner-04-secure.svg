 <text x="40" y="50" font-family="Menlo, 'JetBrains Mono', monospace" font-size="12" letter-spacing="2.5" fill="#f43f5e">MODULE 04 · 50 MIN · LAB: lab4-security</text>
 <text x="38" y="100" font-family="Creepster, 'Chalkboard SE', Impact, fantasy" font-size="44" letter-spacing="1" fill="#efe3cc" filter="url(#b4-tg)">Securing MCP</text>
 <text x="40" y="132" font-size="17" fill="#d8cfc0">Watch an agent delete customers because a ticket asked.</text>
 <text x="40" y="154" font-size="17" fill="#d8cfc0">Then make it <tspan fill="#fb7185" font-weight="700">impossible</tspan>, not just unlikely.</text>
 <g font-weight="700">
