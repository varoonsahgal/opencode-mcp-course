  <rect x="164" y="174" width="108" height="26" rx="13" fill="#e11d48" fill-opacity=".18" stroke="#e11d48"/><text x="218" y="191" text-anchor="middle" fill="#fecdd3" font-size="12">poisoned tool</text>
