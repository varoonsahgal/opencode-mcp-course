<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Module 5: the on-call helper. A pager goes off; the agent may read everything, but the one write waits at an ASK gate and restart is not wired at all.">
 <title>Module 5 · Apply</title>
 <style>
  .b5-tw { animation: b5-tw 3.2s ease-in-out infinite; }
  .b5-fly { animation: b5-fly 6s ease-in-out infinite; }
  .b5-flk { animation: b5-flk 3.1s steps(1) infinite; }
  .b5-flow { stroke-dasharray: 4 10; animation: b5-flow 1.4s linear infinite; }
  .b5-ring { animation: b5-ring 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .b5-halo { animation: b5-halo 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .b5-blink { animation: b5-blink 1.6s steps(1) infinite; }
  .b5-tick { animation: b5-tick 1s steps(1) infinite; }
  @keyframes b5-tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
  @keyframes b5-fly { 0%,100% { transform: translate(0,0) rotate(0); } 50% { transform: translate(12px,-7px) rotate(-8deg); } }
  @keyframes b5-flk { 0%,64% { opacity: 1; } 65%,70% { opacity: .3; } 71%,78% { opacity: 1; } 79%,82% { opacity: .4; } 83%,100% { opacity: 1; } }
  @keyframes b5-flow { to { stroke-dashoffset: -28; } }
  @keyframes b5-ring { 0%,100% { transform: rotate(0); } 10% { transform: rotate(-9deg); } 20% { transform: rotate(9deg); } 30% { transform: rotate(-6deg); } 40% { transform: rotate(0); } }
  @keyframes b5-halo { 0% { opacity: .6; transform: scale(.95); } 100% { opacity: 0; transform: scale(1.5); } }
  @keyframes b5-blink { 0%,55% { opacity: 1; } 56%,100% { opacity: .3; } }
  @keyframes b5-tick { 0%,49% { opacity: 1; } 50%,100% { opacity: .15; } }
  @media (prefers-reduced-motion: reduce) { .b5-tw, .b5-fly, .b5-flk, .b5-flow, .b5-ring, .b5-halo, .b5-blink, .b5-tick { animation: none !important; } }
 </style>
