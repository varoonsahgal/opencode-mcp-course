 <text x="40" y="50" font-family="Menlo, 'JetBrains Mono', monospace" font-size="12" letter-spacing="2.5" fill="#22c55e">MODULE 05 · 40 MIN · LAB: lab5-oncall</text>
 <text x="38" y="100" font-family="Creepster, 'Chalkboard SE', Impact, fantasy" font-size="44" letter-spacing="1" fill="#efe3cc" filter="url(#b5-tg)">The On-Call Helper</text>
 <text x="40" y="132" font-size="17" fill="#d8cfc0">You are paged. Build the agent that reads everything,</text>
 <text x="40" y="154" font-size="17" fill="#d8cfc0">writes once, <tspan fill="#fb7185" font-weight="700">and cannot be talked into a restart.</tspan></text>
 <g font-weight="700">
  <rect x="40" y="174" width="132" height="26" rx="13" fill="#22c55e" fill-opacity=".2" stroke="#22c55e"/><text x="106" y="191" text-anchor="middle" fill="#bbf7d0" font-size="12">7 acceptance tests</text>
  <rect x="180" y="174" width="112" height="26" rx="13" fill="#22c55e" fill-opacity=".2" stroke="#22c55e"/><text x="236" y="191" text-anchor="middle" fill="#bbf7d0" font-size="12">1 gated write</text>
  <rect x="300" y="174" width="140" height="26" rx="13" fill="#e11d48" fill-opacity=".2" stroke="#e11d48"/><text x="370" y="191" text-anchor="middle" fill="#fecdd3" font-size="12">0 restarts, ever</text>
 </g>

