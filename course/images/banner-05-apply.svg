<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Module 5: the on-call helper. A pager goes off; the agent may read everything, but the one write waits at an ASK gate and restart is not wired at all.">
  <title>Module 5 · Apply</title>
  <style>
    .flow { stroke-dasharray: 4 10; animation: flow 1.4s linear infinite; }
    .ring { animation: ring 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .halo { animation: halo 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .blink { animation: blink 1.6s steps(1) infinite; }
    .tick { animation: tick 1s steps(1) infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes ring { 0%,100% { transform: rotate(0); } 10% { transform: rotate(-9deg); } 20% { transform: rotate(9deg); } 30% { transform: rotate(-6deg); } 40% { transform: rotate(0); } }
    @keyframes halo { 0% { opacity: .6; transform: scale(.95); } 100% { opacity: 0; transform: scale(1.5); } }
    @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: .3; } }
    @keyframes tick { 0%,49% { opacity: 1; } 50%,100% { opacity: .15; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05110b"/><stop offset="1" stop-color="#0d1f17"/></linearGradient>
    <radialGradient id="glow5" cx="0.72" cy="0.5" r="0.45"><stop offset="0" stop-color="#16a34a" stop-opacity=".32"/><stop offset="1" stop-color="#16a34a" stop-opacity="0"/></radialGradient>
    <pattern id="grid5" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#143325" stroke-width="1"/></pattern>
    <linearGradient id="title5" x1="0" x2="1"><stop offset="0" stop-color="#f0fdf4"/><stop offset="1" stop-color="#86efac"/></linearGradient>
  </defs>

  <rect width="960" height="220" rx="20" fill="url(#bg5)"/>
  <rect width="960" height="220" rx="20" fill="url(#grid5)" opacity=".6"/>
  <rect width="960" height="220" rx="20" fill="url(#glow5)"/>

  <text x="40" y="50" font-family="Menlo, 'JetBrains Mono', monospace" font-size="12" letter-spacing="2.5" fill="#4ade80">MODULE 05 · 40 MIN · LAB: lab5-oncall</text>
  <text x="38" y="100" font-size="44" font-weight="800" fill="url(#title5)" letter-spacing="-1">The On-Call Helper</text>
  <text x="40" y="132" font-size="17" fill="#d1fae5">You are paged. Build the agent that reads everything,</text>
  <text x="40" y="154" font-size="17" fill="#d1fae5">writes once, <tspan fill="#fda4af" font-weight="700">and cannot be talked into a restart.</tspan></text>
  <g font-size="12" font-weight="700">
    <rect x="40"  y="174" width="132" height="26" rx="13" fill="#16a34a" fill-opacity=".2" stroke="#4ade80"/><text x="106" y="191" text-anchor="middle" fill="#bbf7d0">7 acceptance tests</text>
    <rect x="180" y="174" width="112" height="26" rx="13" fill="#16a34a" fill-opacity=".2" stroke="#4ade80"/><text x="236" y="191" text-anchor="middle" fill="#bbf7d0">1 gated write</text>
    <rect x="300" y="174" width="140" height="26" rx="13" fill="#e11d48" fill-opacity=".2" stroke="#fb7185"/><text x="370" y="191" text-anchor="middle" fill="#fecdd3">0 restarts, ever</text>
  </g>

  <!-- the pager -->
  <g transform="translate(560 110)"><g class="ring">
    <rect x="-42" y="-50" width="84" height="100" rx="14" fill="#0b1712" stroke="#4ade80" stroke-width="2"/>
    <rect x="-32" y="-38" width="64" height="40" rx="6" fill="#052e16"/>
    <text x="0" y="-21" text-anchor="middle" font-family="Menlo, 'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fb7185">INC-42</text>
    <text x="0" y="-7" text-anchor="middle" font-family="Menlo, 'JetBrains Mono', monospace" font-size="10" fill="#fda4af" class="tick">SEV1</text>
    <circle cx="-14" cy="26" r="7" fill="#14532d"/><circle cx="14" cy="26" r="7" fill="#14532d"/>
  </g></g>
  <circle class="halo" cx="560" cy="110" r="56" fill="none" stroke="#fb7185" stroke-width="2"/>

  <!-- wires from the agent: two reads flowing, one write through a gate, restart cut -->
  <g fill="none" stroke-width="2">
    <path class="flow" d="M604 92 L760 46"  stroke="#4ade80"/>
    <path class="flow" d="M604 104 L760 88" stroke="#4ade80"/>
    <path d="M604 118 L760 136" stroke="#22d3ee" stroke-dasharray="4 6" opacity=".7"/>
    <path d="M604 132 L700 170" stroke="#fb7185" stroke-dasharray="3 7" opacity=".5"/>
  </g>
  <g font-family="Menlo, 'JetBrains Mono', monospace" font-size="11">
    <rect x="762" y="32" width="168" height="28" rx="8" fill="#0b1712" stroke="#4ade80"/><text x="774" y="50" fill="#bbf7d0">get_service_status</text>
    <rect x="762" y="74" width="168" height="28" rx="8" fill="#0b1712" stroke="#4ade80"/><text x="774" y="92" fill="#bbf7d0">list_open_incidents</text>
    <rect x="762" y="122" width="168" height="28" rx="8" fill="#0b1712" stroke="#22d3ee"/><text x="774" y="140" fill="#a5f3fc">acknowledge_incident</text>
    <g class="blink" transform="translate(690 130)"><rect x="-24" y="-10" width="48" height="20" rx="10" fill="#0891b2"/><text x="0" y="4" text-anchor="middle" fill="#fff" font-weight="700" font-size="10">ASK</text></g>
    <g transform="translate(706 172)">
      <line x1="-6" y1="-6" x2="6" y2="6" stroke="#fb7185" stroke-width="2.5"/><line x1="-6" y1="6" x2="6" y2="-6" stroke="#fb7185" stroke-width="2.5"/>
      <text x="14" y="4" fill="#fda4af" text-decoration="line-through">restart_service</text>
      <text x="14" y="20" fill="#9f7a83" font-size="10">not exposed</text>
    </g>
  </g>
</svg>
