<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The OAuth bootstrap for an MCP server: the client calls the desk without a token and gets a 401 naming the protected resource metadata; it fetches that document, then the authorization server's metadata; it registers as a client; the person signs in at the authorization server in a browser; a one-time code comes back to the client's loopback callback; the client exchanges the code plus its PKCE verifier for a JWT; the desk verifies signature, issuer, audience, expiry and scopes and answers.">
  <defs>
    <marker id="od-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker>
    <marker id="od-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="od-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e22ce"/></marker>
    <marker id="od-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
  </defs>
  <rect width="960" height="600" rx="18" fill="#fbfbfd"/>
  <text x="32" y="40" font-size="22" font-weight="700" fill="#0f172a">From one 401 to a signed-in agent</text>
  <text x="32" y="64" font-size="14" fill="#475569">Every arrow is a request you can make with curl in Exercise 9.B. OpenCode and login.ts make them for you.</text>

  <!-- lifelines -->
  <g font-size="13" font-weight="700">
    <rect x="40" y="86" width="150" height="40" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="115" y="111" text-anchor="middle" fill="#3730a3">client (host)</text>
    <rect x="290" y="86" width="150" height="40" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="2"/><text x="365" y="111" text-anchor="middle" fill="#9a3412">desk (resource)</text>
    <rect x="540" y="86" width="170" height="40" rx="10" fill="#f5f3ff" stroke="#7e22ce" stroke-width="2"/><text x="625" y="111" text-anchor="middle" fill="#6b21a8">authorization server</text>
    <rect x="790" y="86" width="130" height="40" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="855" y="111" text-anchor="middle" fill="#155e75">the person</text>
  </g>
  <line x1="115" y1="126" x2="115" y2="560" stroke="#c7d2fe" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="365" y1="126" x2="365" y2="560" stroke="#fed7aa" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="625" y1="126" x2="625" y2="560" stroke="#ddd6fe" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="855" y1="126" x2="855" y2="560" stroke="#a5f3fc" stroke-width="2" stroke-dasharray="6 5"/>

  <g font-size="11.5" font-family="Menlo, 'JetBrains Mono', monospace">
    <line x1="117" y1="156" x2="361" y2="156" stroke="#4f46e5" stroke-width="2" marker-end="url(#od-a)"/><text x="240" y="149" text-anchor="middle" fill="#3730a3">1 POST /mcp (no token)</text>
    <line x1="361" y1="180" x2="119" y2="180" stroke="#b45309" stroke-width="2" marker-end="url(#od-b)"/><text x="122" y="196" text-anchor="start" fill="#9a3412">401 · resource_metadata="…/mcp"</text>
    <line x1="117" y1="222" x2="361" y2="222" stroke="#4f46e5" stroke-width="2" marker-end="url(#od-a)"/><text x="240" y="215" text-anchor="middle" fill="#3730a3">2 GET that document (RFC 9728)</text>
    <line x1="361" y1="242" x2="119" y2="242" stroke="#b45309" stroke-width="2" marker-end="url(#od-b)"/><text x="122" y="258" text-anchor="start" fill="#9a3412">{ authorization_servers: [AS] }</text>
    <line x1="117" y1="284" x2="621" y2="284" stroke="#4f46e5" stroke-width="2" marker-end="url(#od-a)"/><text x="370" y="277" text-anchor="middle" fill="#3730a3">3 GET /.well-known/oauth-authorization-server (RFC 8414) → endpoints, S256, grant types</text>
    <line x1="117" y1="316" x2="621" y2="316" stroke="#4f46e5" stroke-width="2" marker-end="url(#od-a)"/><text x="370" y="309" text-anchor="middle" fill="#3730a3">4 POST /register (RFC 7591, optional) → client_id, redirect_uris pinned</text>
    <line x1="117" y1="352" x2="851" y2="352" stroke="#0e7490" stroke-width="2" marker-end="url(#od-d)"/><text x="480" y="345" text-anchor="middle" fill="#155e75">5 browser → /authorize?client_id&amp;scope&amp;state&amp;code_challenge (PKCE)&amp;resource (RFC 8707)</text>
    <line x1="851" y1="384" x2="629" y2="384" stroke="#0e7490" stroke-width="2" marker-end="url(#od-d)"/><text x="740" y="377" text-anchor="middle" fill="#155e75">6 signs in, sees the scopes, consents</text>
    <line x1="621" y1="414" x2="119" y2="414" stroke="#7e22ce" stroke-width="2" marker-end="url(#od-c)"/><text x="370" y="407" text-anchor="middle" fill="#6b21a8">7 302 → …/callback?code&amp;state&amp;iss (RFC 9207): a one-time code</text>
    <line x1="117" y1="448" x2="621" y2="448" stroke="#4f46e5" stroke-width="2" marker-end="url(#od-a)"/><text x="370" y="441" text-anchor="middle" fill="#3730a3">8 POST /token  code + code_verifier + redirect_uri + resource</text>
    <line x1="621" y1="470" x2="119" y2="470" stroke="#7e22ce" stroke-width="2" marker-end="url(#od-c)"/><text x="370" y="486" text-anchor="middle" fill="#6b21a8">{ access_token: JWT (sub, aud, scope, exp), refresh_token }</text>
    <line x1="117" y1="516" x2="361" y2="516" stroke="#4f46e5" stroke-width="2" marker-end="url(#od-a)"/><text x="240" y="509" text-anchor="middle" fill="#3730a3">9 POST /mcp · Authorization: Bearer JWT</text>
    <line x1="361" y1="540" x2="119" y2="540" stroke="#b45309" stroke-width="2" marker-end="url(#od-b)"/><text x="122" y="556" text-anchor="start" fill="#9a3412">200 · iss, aud, exp, scope ok</text>
  </g>
  <rect x="690" y="500" width="240" height="64" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="810" y="522" text-anchor="middle" font-size="12" font-weight="700" fill="#9f1239">what the desk never sees</text>
  <text x="810" y="540" text-anchor="middle" font-size="11.5" fill="#9f1239">the password, the code, the verifier,</text>
  <text x="810" y="555" text-anchor="middle" font-size="11.5" fill="#9f1239">the refresh token. Only the bearer JWT.</text>
  <text x="480" y="586" text-anchor="middle" font-size="12" fill="#475569">Steps 2 to 8 happen once per login. Step 9 happens on every request. When the JWT expires the client goes back to step 8 with the refresh token instead of a code.</text>
</svg>
