<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#fecdd3"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
  </defs>
  <rect width="960" height="400" rx="18" fill="#fbfbfd"/>
  <text x="32" y="40" font-size="22" font-weight="700" fill="#0f172a">Designing tools: raw access vs. intent-level capabilities</text>
  <text x="32" y="64" font-size="14" fill="#475569">The same backend can be exposed in very different ways. Where you land on this line decides most of your security story.</text>

  <rect x="32" y="96" width="896" height="16" rx="8" fill="url(#g1)"/>
  <text x="40" y="134" font-size="12.5" font-weight="700" fill="#9f1239">RAW ACCESS · "do anything"</text>
  <text x="920" y="134" text-anchor="end" font-size="12.5" font-weight="700" fill="#14532d">INTENT-LEVEL · "do this one thing well"</text>

  <!-- columns -->
  <g font-size="12">
    <rect x="32" y="156" width="280" height="206" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="48" y="182" font-weight="700" fill="#9f1239" font-family="Menlo, monospace">run_sql(sql)</text>
    <text x="48" y="202" fill="#881337">http_request(method, url, body)</text>
    <text x="48" y="222" fill="#881337">run_shell(command)</text>
    <text x="48" y="250" fill="#4c0519">+ one tool covers every use case</text>
    <text x="48" y="268" fill="#4c0519">+ fast to build on Friday afternoon</text>
    <text x="48" y="294" fill="#9f1239">– the model writes the query/command</text>
    <text x="48" y="312" fill="#9f1239">– impossible to say "ask before writes"</text>
    <text x="48" y="330" fill="#9f1239">– injection in data = injection in SQL</text>
    <text x="48" y="348" fill="#9f1239">– audit log says: "ran some SQL"</text>

    <rect x="340" y="156" width="280" height="206" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="356" y="182" font-weight="700" fill="#9a3412" font-family="Menlo, monospace">query_table(table, filters)</text>
    <text x="356" y="202" fill="#7c2d12">update_row(table, id, fields)</text>
    <text x="356" y="222" fill="#7c2d12">fetch_url(url) with allowlist</text>
    <text x="356" y="250" fill="#431407">+ generic but parameterized</text>
    <text x="356" y="268" fill="#431407">+ reads and writes are separate tools</text>
    <text x="356" y="294" fill="#9a3412">– still exposes every table</text>
    <text x="356" y="312" fill="#9a3412">– permission rules by tool, not by data</text>
    <text x="356" y="330" fill="#9a3412">– model must learn your schema</text>

    <rect x="648" y="156" width="280" height="206" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="664" y="182" font-weight="700" fill="#14532d" font-family="Menlo, monospace">list_open_tickets(limit)</text>
    <text x="664" y="202" fill="#14532d">search_customers(query, country)</text>
    <text x="664" y="222" fill="#14532d">close_ticket(id, reason)</text>
    <text x="664" y="250" fill="#052e16">+ each tool = one business action</text>
    <text x="664" y="268" fill="#052e16">+ read-only DB connection for reads</text>
    <text x="664" y="286" fill="#052e16">+ "ask" on exactly the risky tool</text>
    <text x="664" y="304" fill="#052e16">+ audit log reads like a story</text>
    <text x="664" y="330" fill="#15803d">– more tools to write and describe</text>
    <text x="664" y="348" fill="#15803d">– cannot answer questions you didn't foresee</text>
  </g>
  <text x="32" y="388" font-size="12" fill="#64748b">Heuristic: name tools after what a careful colleague would ask you to do, not after the API you happen to have. Descriptions are prompts.</text>
</svg>
