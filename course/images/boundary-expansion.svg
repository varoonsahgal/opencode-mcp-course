<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="420" rx="18" fill="#fbfbfd"/>
  <text x="32" y="40" font-size="22" font-weight="700" fill="#0f172a">Every server you add grows the agent's blast radius</text>
  <text x="32" y="64" font-size="14" fill="#475569">"What can go wrong if the model is tricked?" has a different answer at each step. Draw this for your own setup before adding a server.</text>

  <!-- step 1 -->
  <g>
    <circle cx="160" cy="230" r="70" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="160" y="226" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">OpenCode alone</text>
    <text x="160" y="244" text-anchor="middle" font-size="11" fill="#3730a3">project files + shell</text>
    <text x="160" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Worst case</text>
    <text x="160" y="348" text-anchor="middle" font-size="11.5" fill="#475569">wrong edits, bad commands,</text>
    <text x="160" y="364" text-anchor="middle" font-size="11.5" fill="#475569">git can undo most of it</text>
  </g>
  <!-- step 2 -->
  <g>
    <circle cx="430" cy="230" r="100" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <circle cx="430" cy="230" r="70" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="430" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a3412">+ teamdb (run_sql)</text>
    <text x="430" y="226" text-anchor="middle" font-size="12" fill="#3730a3">files + shell</text>
    <text x="430" y="244" text-anchor="middle" font-size="12" fill="#9a3412">+ every row, read &amp; write</text>
    <text x="430" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Worst case</text>
    <text x="430" y="348" text-anchor="middle" font-size="11.5" fill="#475569">customer data deleted or leaked,</text>
    <text x="430" y="364" text-anchor="middle" font-size="11.5" fill="#475569">no undo, no audit trail</text>
  </g>
  <!-- step 3 -->
  <g>
    <circle cx="760" cy="230" r="130" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
    <circle cx="760" cy="230" r="100" fill="#fff7ed" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="760" cy="230" r="70" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="760" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9f1239">+ email / Slack / GitHub write</text>
    <text x="760" y="226" text-anchor="middle" font-size="12" fill="#3730a3">files + shell</text>
    <text x="760" y="244" text-anchor="middle" font-size="12" fill="#9a3412">+ database</text>
    <text x="760" y="262" text-anchor="middle" font-size="12" fill="#9f1239">+ a way to send data OUT</text>
    <text x="760" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Worst case</text>
    <text x="760" y="398" text-anchor="middle" font-size="11.5" fill="#475569">silent exfiltration to an attacker (the lethal trifecta is complete)</text>
  </g>
  <path d="M232 230 L 326 230" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M532 230 L 626 230" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
</svg>
