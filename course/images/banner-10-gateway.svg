<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Module 10: the gateway. Three people's agents pass through one gated door, where a pumpkin checks policy, quarantines a poisoned tool and redacts secrets, before reaching four servers behind it.">
 <title>Module 10 · The gateway</title>
 <style>
  .b10-tw { animation: b10-tw 3.2s ease-in-out infinite; }
  .b10-fly { animation: b10-fly 6s ease-in-out infinite; }
  .b10-flow { stroke-dasharray: 4 10; animation: b10-flow 1.4s linear infinite; }
  .b10-pulse { animation: b10-pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .b10-blink { animation: b10-blink 2.6s steps(1) infinite; }
  @keyframes b10-tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
  @keyframes b10-fly { 0%,100% { transform: translate(0,0) rotate(0); } 50% { transform: translate(12px,-7px) rotate(-8deg); } }
  @keyframes b10-flow { to { stroke-dashoffset: -28; } }
  @keyframes b10-pulse { 0% { opacity: .55; transform: scale(.96); } 100% { opacity: 0; transform: scale(1.45); } }
  @keyframes b10-blink { 0%,50% { opacity: 1; } 51%,100% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .b10-tw, .b10-fly, .b10-flow, .b10-pulse, .b10-blink { animation: none !important; } }
 </style>
 <defs>
  <linearGradient id="b10-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0612"/><stop offset="1" stop-color="#14231a"/></linearGradient>
  <pattern id="b10-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1f2e25"/></pattern>
  <radialGradient id="b10-glow" cx="0.72" cy="0.5" r="0.45"><stop offset="0" stop-color="#4ade80" stop-opacity=".22"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></radialGradient>
  <radialGradient id="b10-mg"><stop offset=".3" stop-color="#ffe9b3" stop-opacity=".3"/><stop offset="1" stop-color="#ffe9b3" stop-opacity="0"/></radialGradient>
  <filter id="b10-tg" x="-6%" y="-40%" width="112%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#4ade80" flood-opacity=".7"/><feComposite in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="b10-fg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <path id="b10-bat" d="M0,-4L-2,-8L-3,-3C-9,-9 -15,-8 -19,-4C-15,-3 -14,0 -13,3C-10,0 -8,1 -7,4C-5,2 -3,3 -2,5L0,4L2,5C3,3 5,2 7,4C8,1 10,0 13,3C14,0 15,-3 19,-4C15,-8 9,-9 3,-3L2,-8Z" fill="#0a0612" stroke="#a855f7" stroke-opacity=".6" stroke-width=".9" stroke-linejoin="round"/>
  <g id="b10-pk"><path d="M-2,-19C-3,-24 0,-28 6,-30C4,-27 5,-22 4,-19Z" fill="#22c55e"/><ellipse cy="1" rx="24" ry="19" fill="#e0661a"/><ellipse rx="17" ry="20" fill="#ff8a1f"/><path d="M-9,-19C-13,-6 -13,8 -9,20M9,-19C13,-6 13,8 9,20" fill="none" stroke="#e0661a" stroke-width="1.4"/></g>
  <path id="b10-pf" d="M-13,-1L-8,-10L-3,-1ZM3,-1L8,-10L13,-1ZM-2,6L0,2L2,6ZM-13,8Q0,18 13,8L10,8 9,12 6,8 -6,8 -9,12 -10,8Z"/>
  <g id="b10-gh"><path d="M-6,7V-2a6,6 0 0 1 12,0V7l-2,-2-2,2-2,-2-2,2-2,-2z" fill="#efe3cc" opacity=".9"/><circle cx="-2.2" cy="-2" r="1.1" fill="#0a0612"/><circle cx="2.2" cy="-2" r="1.1" fill="#0a0612"/></g>
 </defs>
 <rect width="960" height="220" rx="20" fill="url(#b10-bg)"/>
 <rect width="960" height="220" rx="20" fill="url(#b10-grid)" opacity=".5"/>
 <rect width="960" height="220" rx="20" fill="url(#b10-glow)"/>
