 <g transform="translate(578 24) scale(0.5)"><use href="#b10-bat" class="b10-fly" style="animation-duration:6s;animation-delay:-1s"/></g><g transform="translate(884 22) scale(0.5)"><use href="#b10-bat" class="b10-fly" style="animation-duration:5.5s;animation-delay:-2s"/></g>
 <path d="M960,220L892.5,198.1M960,220L902.6,178.3M960,220L918.3,162.6M960,220L938.1,152.5M943.0,220.0Q944.9,217.6 943.8,214.7Q946.4,213.1 946.2,210.0Q949.2,209.2 950.0,206.2Q953.1,206.4 954.7,203.8Q957.6,204.9 960.0,203.0M927.0,220.0Q930.7,215.4 928.6,209.8Q933.5,206.5 933.3,200.6Q939.0,199.0 940.6,193.3Q946.5,193.5 949.8,188.6Q955.4,190.7 960.0,187.0M911.0,220.0Q916.4,213.1 913.4,204.9Q920.7,200.0 920.4,191.2Q928.8,188.8 931.2,180.4Q940.0,180.7 944.9,173.4Q953.1,176.4 960.0,171.0" fill="none" stroke="#efe3cc" stroke-opacity=".25" stroke-width=".8"/>

 <text x="40" y="50" font-family="Menlo, 'JetBrains Mono', monospace" font-size="12" letter-spacing="2.5" fill="#4ade80">MODULE 10 · 60 MIN · ADVANCED TRACK · LAB: lab10-gateway</text>
 <text x="38" y="100" font-family="Creepster, 'Chalkboard SE', Impact, fantasy" font-size="44" letter-spacing="1" fill="#efe3cc" filter="url(#b10-tg)" textLength="440" lengthAdjust="spacingAndGlyphs">The Gateway</text>
 <text x="40" y="132" font-size="17" fill="#d8cfc0">One door in front of every server: one policy, one audit trail,</text>
 <text x="40" y="154" font-size="17" fill="#d8cfc0">one place for the keys, <tspan fill="#86efac" font-weight="700">and an honest list of what it cannot stop.</tspan></text>
 <g font-weight="700">
  <rect x="40" y="174" width="78" height="26" rx="13" fill="#4ade80" fill-opacity=".16" stroke="#4ade80"/><text x="79" y="191" text-anchor="middle" fill="#dcfce7" font-size="12">policy</text>
  <rect x="128" y="174" width="104" height="26" rx="13" fill="#4ade80" fill-opacity=".16" stroke="#4ade80"/><text x="180" y="191" text-anchor="middle" fill="#dcfce7" font-size="12">quarantine</text>
  <rect x="242" y="174" width="96" height="26" rx="13" fill="#4ade80" fill-opacity=".16" stroke="#4ade80"/><text x="290" y="191" text-anchor="middle" fill="#dcfce7" font-size="12">redaction</text>
  <rect x="348" y="174" width="72" height="26" rx="13" fill="#4ade80" fill-opacity=".16" stroke="#4ade80"/><text x="384" y="191" text-anchor="middle" fill="#dcfce7" font-size="12">audit</text>
 </g>

 <!-- left of the door: three agents -->
 <g font-family="Menlo, 'JetBrains Mono', monospace" font-size="10" fill="#dcfce7" text-anchor="middle">
  <use href="#b10-gh" x="600" y="68"/><text x="600" y="90">alice</text>
  <use href="#b10-gh" x="600" y="116"/><text x="600" y="138">bob</text>
  <use href="#b10-gh" x="600" y="164"/><text x="600" y="186">carol</text>
 </g>
 <g fill="none" stroke-width="2">
  <path class="b10-flow" d="M614 66 C640 66 650 110 676 110" stroke="#86efac"/>
  <path class="b10-flow" d="M614 114 C640 114 650 110 676 110" stroke="#86efac"/>
  <path class="b10-flow" d="M614 162 C640 162 650 110 676 110" stroke="#86efac"/>
 </g>
 <!-- the door with the pumpkin bouncer -->
 <rect x="676" y="52" width="80" height="128" rx="40" fill="#120a1e" stroke="#4ade80" stroke-width="2"/>
