  <rect x="812" y="52" width="86" height="20" rx="6" fill="#120a1e" stroke="#4ade80"/><text x="855" y="66" text-anchor="middle" fill="#dcfce7">teamdb</text>
  <rect x="812" y="88" width="86" height="20" rx="6" fill="#120a1e" stroke="#4ade80"/><text x="855" y="102" text-anchor="middle" fill="#dcfce7">itdesk</text>
