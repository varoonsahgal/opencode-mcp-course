<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Three-panel comic: a pumpkin bouncer at the gateway door turns away a DELETE; then catches a tool whose description hides an IMPORTANT note; then waves through a skeleton in a trench coat labelled WITH, under which a DELETE is hiding, and the database behind the door says ouch.">
<title>Panel 1: a skeleton holds a sign DELETE FROM customers. Pumpkin bouncer with a clipboard: Reads only, pal. Panel 2: a ghost carries a tool card with a hidden IMPORTANT note. Bouncer: That one goes in the box, and a lead reads it. Panel 3: a skeleton in a trench coat labelled WITH, a DELETE poking out underneath. Bouncer: Starts with WITH. You're on the list. Behind the door the database barrel says: Ouch. Caption: A gateway is a very good bouncer. It is not a lock on the vault.</title>
