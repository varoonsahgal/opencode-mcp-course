<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Three-panel comic: a ghost server tries to push a question down a connection that no longer leads anywhere; instead it hands the skeleton a sealed envelope to bring back with the answer; the skeleton returns with the seal broken and the ghost refuses it.">
<title>Panel 1: Ghost (the server) shouts "Do you confirm?" into a pipe that ends in a brick wall labelled load balancer. Ghost: Hello? Anybody? Panel 2: Ghost hands a sealed envelope to the skeleton. Ghost: Bring this back with your answer. The wax seal is my signature. Panel 3: the skeleton returns with the envelope open and a different version written on it. Ghost: The seal is broken. Nice try. Caption: A request that stands alone can be answered by anyone. State that round-trips must be sealed.</title>
