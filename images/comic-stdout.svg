<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Three-panel comic: a pumpkin server shouts console.log into the stdout pipe, the ghost client reads non-JSON and panics, so the pumpkin whispers to stderr instead.">
