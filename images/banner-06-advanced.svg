 <text x="40" y="50" font-family="Menlo, 'JetBrains Mono', monospace" font-size="12" letter-spacing="2.5" fill="#c084fc">MODULE 06 · 50 MIN · OPTIONAL · LAB: lab6-advanced</text>
 <text x="38" y="100" font-family="Creepster, 'Chalkboard SE', Impact, fantasy" font-size="44" letter-spacing="1" fill="#efe3cc" filter="url(#b6-tg)" textLength="507" lengthAdjust="spacingAndGlyphs">Advanced MCP: Going Remote</text>
 <text x="40" y="132" font-size="17" fill="#d8cfc0">One server, many people, one endpoint. Tokens that say who,</text>
 <text x="40" y="154" font-size="17" fill="#d8cfc0">tools that come and go, <tspan fill="#fb7185" font-weight="700">and a host you have to interrogate.</tspan></text>
