<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Module 6: advanced MCP. Three people with three tokens connect over HTTP to one shared release-desk server; a freeze withdraws the deploy tool from every session.">
 <title>Module 6 · Advanced MCP</title>
 <style>
  .b6-tw { animation: b6-tw 3.2s ease-in-out infinite; }
  .b6-fly { animation: b6-fly 6s ease-in-out infinite; }
  .b6-flk { animation: b6-flk 3.1s steps(1) infinite; }
  .b6-flow { stroke-dasharray: 4 10; animation: b6-flow 1.4s linear infinite; }
  .b6-flowback { stroke-dasharray: 3 9; animation: b6-flowback 1.8s linear infinite; }
  .b6-pulse { animation: b6-pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .b6-fade { animation: b6-fade 4s ease-in-out infinite; }
  @keyframes b6-tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
  @keyframes b6-fly { 0%,100% { transform: translate(0,0) rotate(0); } 50% { transform: translate(12px,-7px) rotate(-8deg); } }
  @keyframes b6-flk { 0%,64% { opacity: 1; } 65%,70% { opacity: .3; } 71%,78% { opacity: 1; } 79%,82% { opacity: .4; } 83%,100% { opacity: 1; } }
  @keyframes b6-flow { to { stroke-dashoffset: -28; } }
  @keyframes b6-flowback { to { stroke-dashoffset: 24; } }
  @keyframes b6-pulse { 0% { opacity: .55; transform: scale(.96); } 100% { opacity: 0; transform: scale(1.45); } }
  @keyframes b6-fade { 0%,45% { opacity: 1; } 55%,90% { opacity: .18; } 100% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .b6-tw, .b6-fly, .b6-flk, .b6-flow, .b6-flowback, .b6-pulse, .b6-fade { animation: none !important; } }
 </style>
