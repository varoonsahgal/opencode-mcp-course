<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="960" height="400" rx="18" fill="#fbfbfd"/>
  <text x="32" y="40" font-size="22" font-weight="700" fill="#0f172a">Local vs remote: same messages, different pipe</text>
  <text x="32" y="64" font-size="14" fill="#475569">The data layer (JSON-RPC, tools, resources, prompts) is identical. Only the pipe changes, and with it who runs the code and who holds the keys.</text>

  <!-- Local -->
  <rect x="32" y="92" width="440" height="240" rx="16" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="52" y="122" font-size="16" font-weight="700" fill="#9a3412">LOCAL  ·  "type": "local"  ·  stdio</text>
  <rect x="52" y="140" width="130" height="60" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="117" y="166" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">OpenCode</text>
  <text x="117" y="184" text-anchor="middle" font-size="11" fill="#3730a3">spawns a child</text>
  <rect x="322" y="140" width="130" height="60" rx="10" fill="#ffffff" stroke="#d97706"/>
  <text x="387" y="166" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a3412">server process</text>
  <text x="387" y="184" text-anchor="middle" font-size="11" fill="#9a3412">uvx mcp-server-time</text>
  <line x1="182" y1="160" x2="320" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#ta)"/>
  <line x1="320" y1="180" x2="184" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#ta)"/>
  <text x="252" y="154" text-anchor="middle" font-size="10.5" fill="#334155">stdin: one JSON per line</text>
  <text x="252" y="196" text-anchor="middle" font-size="10.5" fill="#334155">stdout: one JSON per line</text>
  <text x="52" y="230" font-size="12" fill="#431407">• runs as YOU, with your env vars, files, network</text>
  <text x="52" y="250" font-size="12" fill="#431407">• one client per process; dies when OpenCode exits</text>
  <text x="52" y="270" font-size="12" fill="#431407">• stderr is free for logging; stdout is sacred</text>
  <text x="52" y="290" font-size="12" fill="#431407">• you install and run the code  →  supply-chain risk is yours</text>
  <text x="52" y="316" font-size="11.5" font-weight="700" fill="#9a3412">Use for: filesystems, local DBs, dev tools, anything needing your machine.</text>

  <!-- Remote -->
  <rect x="488" y="92" width="440" height="240" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="508" y="122" font-size="16" font-weight="700" fill="#155e75">REMOTE  ·  "type": "remote"  ·  Streamable HTTP</text>
  <rect x="508" y="140" width="130" height="60" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="573" y="166" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">OpenCode</text>
  <text x="573" y="184" text-anchor="middle" font-size="11" fill="#3730a3">HTTP client</text>
  <rect x="778" y="140" width="130" height="60" rx="10" fill="#ffffff" stroke="#0891b2"/>
  <text x="843" y="166" text-anchor="middle" font-size="12.5" font-weight="700" fill="#155e75">their server</text>
  <text x="843" y="184" text-anchor="middle" font-size="11" fill="#155e75">mcp.deepwiki.com/mcp</text>
  <line x1="638" y1="160" x2="776" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#ta)"/>
  <line x1="776" y1="180" x2="640" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#ta)"/>
  <text x="708" y="154" text-anchor="middle" font-size="10.5" fill="#334155">POST /mcp  (+ Authorization)</text>
  <text x="708" y="196" text-anchor="middle" font-size="10.5" fill="#334155">JSON or SSE stream back</text>
  <text x="508" y="230" font-size="12" fill="#083344">• runs on someone else's infrastructure, with THEIR access</text>
  <text x="508" y="250" font-size="12" fill="#083344">• many clients per server; auth via headers or OAuth 2.1</text>
  <text x="508" y="270" font-size="12" fill="#083344">• HTTPS only in production; 401 triggers OAuth in OpenCode</text>
  <text x="508" y="290" font-size="12" fill="#083344">• you send them your prompts/arguments  →  data-sharing risk</text>
  <text x="508" y="316" font-size="11.5" font-weight="700" fill="#155e75">Use for: SaaS products, docs, shared team services, anything multi-user.</text>

  <rect x="32" y="348" width="896" height="36" rx="10" fill="#f1f5f9"/>
  <text x="48" y="371" font-size="12.5" fill="#334155"><tspan font-weight="700">Legacy note:</tspan> the older HTTP+SSE transport (two endpoints) is deprecated. OpenCode tries Streamable HTTP first and falls back to SSE for old servers.</text>
</svg>
