<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="The debugging ladder: four rungs, each one rules something out" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The debugging ladder: four rungs, each one rules something out</title>
  <rect width="960" height="420" rx="18" fill="#fbfbfd"/>
  <text x="32" y="40" font-size="22" font-weight="700" fill="#0f172a">The debugging ladder: four rungs, each one rules something out</text>
  <text x="32" y="64" font-size="14" fill="#475569">Start at the bottom. Each rung either shows you the bug or tells you which rung to climb to next.</text>

  <!-- rung 4 (top) -->
  <rect x="188" y="84" width="740" height="72" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
  <path d="M200 84 h40 v80 h-52 v-68 a12 12 0 0 1 12 -12 z" fill="#7e22ce"/>
  <text x="214" y="127" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">4</text>
  <text x="254" y="108" font-size="12" font-weight="700" fill="#581c87">wiretap (<tspan font-family="Menlo, 'JetBrains Mono', monospace">mcp-tap.mjs</tspan>) + <tspan font-family="Menlo, 'JetBrains Mono', monospace">context-tax.mjs</tspan></text>
  <text x="254" y="127" font-size="11.5" fill="#334155">what is actually on the wire, and what it costs per turn</text>
  <text x="254" y="144" font-size="11.5" font-style="italic" fill="#581c87">for the bugs that are not errors: wrong version, huge instructions, a tool the model never picks</text>
  <!-- lantern at the top of the stairs -->
  <g transform="translate(888 98)">
    <path d="M-6 6 a6 6 0 0 1 12 0" fill="none" stroke="#7e22ce" stroke-width="1.5"/>
    <rect x="-9" y="6" width="18" height="4" rx="1" fill="#7e22ce"/>
    <rect x="-8" y="10" width="16" height="24" rx="2" fill="#fef3c7" stroke="#7e22ce" stroke-width="1.5"/>
    <circle cy="24" r="7" fill="#f59e0b" opacity=".3"/>
    <path d="M0 15 C3 19 4 23 2 26 C1 28 -1 28 -2 26 C-4 23 -3 19 0 15 Z" fill="#f59e0b"/>
    <path d="M0 21 C1.5 23 1.5 25 0 26.5 C-1.5 25 -1.5 23 0 21 Z" fill="#fde68a"/>
    <rect x="-9" y="34" width="18" height="4" rx="1" fill="#7e22ce"/>
  </g>

  <!-- rung 3 -->
  <rect x="136" y="164" width="792" height="72" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <path d="M148 164 h40 v80 h-52 v-68 a12 12 0 0 1 12 -12 z" fill="#4f46e5"/>
  <text x="162" y="207" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">3</text>
  <text x="202" y="188" font-size="12" font-weight="700" fill="#3730a3" font-family="Menlo, 'JetBrains Mono', monospace">npx -y @modelcontextprotocol/inspector --cli &lt;command&gt; --method tools/list</text>
  <text x="202" y="207" font-size="11.5" fill="#334155">the protocol view with OpenCode out of the loop</text>
  <text x="202" y="224" font-size="11.5" font-style="italic" fill="#3730a3">if the Inspector lists tools and OpenCode cannot: opencode.json; if neither can: the server</text>

  <!-- rung 2 -->
  <rect x="84" y="244" width="844" height="72" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <path d="M96 244 h40 v80 h-52 v-68 a12 12 0 0 1 12 -12 z" fill="#b45309"/>
  <text x="110" y="287" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">2</text>
  <text x="150" y="268" font-size="12" font-weight="700" fill="#78350f">run the exact <tspan font-family="Menlo, 'JetBrains Mono', monospace">command</tspan> yourself in the lab folder</text>
  <text x="150" y="287" font-size="11.5" fill="#334155">stderr shows the reason OpenCode hides: missing file, missing env var, crash</text>
  <text x="150" y="304" font-size="11.5" font-style="italic" fill="#78350f">if it starts and waits silently: the server is fine, the bug is in your config → rung 3</text>

  <!-- rung 1 (bottom) -->
  <rect x="32" y="324" width="896" height="72" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <path d="M44 324 h40 v72 h-40 a12 12 0 0 1 -12 -12 v-48 a12 12 0 0 1 12 -12 z" fill="#15803d"/>
  <text x="58" y="367" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">1</text>
  <text x="98" y="348" font-size="12" font-weight="700" fill="#14532d" font-family="Menlo, 'JetBrains Mono', monospace">opencode mcp list</text>
  <text x="98" y="367" font-size="11.5" fill="#334155">the symptom: connected / Connection closed / timed out / needs_auth</text>
  <text x="98" y="384" font-size="11.5" font-style="italic" fill="#14532d">if it fails: go to rung 2</text>
</svg>
