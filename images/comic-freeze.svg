<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Three-panel comic: Bob the skeleton asks his ghost to deploy, but the deploy tool vanished because Carol declared a freeze from another terminal.">
