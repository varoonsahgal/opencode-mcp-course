<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="la" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="960" height="430" rx="18" fill="#fbfbfd"/>
  <text x="32" y="40" font-size="22" font-weight="700" fill="#0f172a">How an agent picks and runs a tool: the loop</text>
  <text x="32" y="64" font-size="14" fill="#475569">The model never executes anything. It emits a structured request; the host decides whether to run it, runs it, and feeds the result back.</text>

  <!-- step boxes -->
  <g>
    <rect x="32" y="110" width="168" height="96" rx="14" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <text x="116" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">1 · Prompt</text>
    <text x="116" y="162" text-anchor="middle" font-size="12" fill="#78350f">"What time is it</text>
    <text x="116" y="179" text-anchor="middle" font-size="12" fill="#78350f">in Tokyo?"</text>
  </g>
  <g>
    <rect x="248" y="110" width="200" height="96" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="348" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">2 · Model reasons</text>
    <text x="348" y="162" text-anchor="middle" font-size="12" fill="#3730a3">context = system prompt + chat</text>
    <text x="348" y="179" text-anchor="middle" font-size="12" fill="#3730a3">+ ALL tool descriptions</text>
  </g>
  <g>
    <rect x="496" y="110" width="200" height="96" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="596" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">3 · Emits a tool call</text>
    <text x="596" y="162" text-anchor="middle" font-size="11.5" fill="#3730a3" font-family="Menlo, monospace">time_get_current_time</text>
    <text x="596" y="179" text-anchor="middle" font-size="11.5" fill="#3730a3" font-family="Menlo, monospace">{"timezone":"Asia/Tokyo"}</text>
  </g>
  <g>
    <rect x="744" y="110" width="184" height="96" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
    <text x="836" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#9f1239">4 · Permission check</text>
    <text x="836" y="162" text-anchor="middle" font-size="12" fill="#9f1239">allow · ask · deny</text>
    <text x="836" y="179" text-anchor="middle" font-size="12" fill="#9f1239">(OpenCode, not the model)</text>
  </g>
  <g>
    <rect x="744" y="256" width="184" height="96" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="836" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#134e4a">5 · MCP client calls</text>
    <text x="836" y="308" text-anchor="middle" font-size="12" fill="#134e4a">tools/call → server</text>
    <text x="836" y="325" text-anchor="middle" font-size="12" fill="#134e4a">server does the real work</text>
  </g>
  <g>
    <rect x="496" y="256" width="200" height="96" rx="14" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="596" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">6 · Result as text</text>
    <text x="596" y="308" text-anchor="middle" font-size="11.5" fill="#9a3412" font-family="Menlo, monospace">{"datetime":"…06:03+09:00"}</text>
    <text x="596" y="325" text-anchor="middle" font-size="12" fill="#9a3412">appended to the conversation</text>
  </g>
  <g>
    <rect x="248" y="256" width="200" height="96" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="348" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">7 · Model reads it</text>
    <text x="348" y="308" text-anchor="middle" font-size="12" fill="#3730a3">another tool call? → back to 3</text>
    <text x="348" y="325" text-anchor="middle" font-size="12" fill="#3730a3">or a final answer</text>
  </g>
  <g>
    <rect x="32" y="256" width="168" height="96" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="116" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">8 · Answer</text>
    <text x="116" y="308" text-anchor="middle" font-size="12" fill="#14532d">"It's 06:03 on Sunday</text>
    <text x="116" y="325" text-anchor="middle" font-size="12" fill="#14532d">in Tokyo."</text>
  </g>

  <!-- arrows -->
  <line x1="200" y1="158" x2="246" y2="158" stroke="#334155" stroke-width="2" marker-end="url(#la)"/>
  <line x1="448" y1="158" x2="494" y2="158" stroke="#334155" stroke-width="2" marker-end="url(#la)"/>
  <line x1="696" y1="158" x2="742" y2="158" stroke="#334155" stroke-width="2" marker-end="url(#la)"/>
  <line x1="836" y1="206" x2="836" y2="254" stroke="#334155" stroke-width="2" marker-end="url(#la)"/>
  <line x1="744" y1="304" x2="698" y2="304" stroke="#334155" stroke-width="2" marker-end="url(#la)"/>
  <line x1="496" y1="304" x2="450" y2="304" stroke="#334155" stroke-width="2" marker-end="url(#la)"/>
  <line x1="248" y1="304" x2="202" y2="304" stroke="#334155" stroke-width="2" marker-end="url(#la)"/>
  <path d="M348 256 C 348 240, 596 240, 596 206" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#la)"/>
  <text x="472" y="224" text-anchor="middle" font-size="11" fill="#64748b">loop while the model keeps calling tools</text>

  <rect x="32" y="376" width="896" height="38" rx="10" fill="#f1f5f9"/>
  <text x="48" y="400" font-size="12.5" fill="#334155"><tspan font-weight="700">Why this matters for security:</tspan> steps 2, 3 and 7 are driven by text in the context, including tool results. Whoever controls that text steers the loop.</text>
</svg>
