 <text x="40" y="50" font-family="Menlo, 'JetBrains Mono', monospace" font-size="12" letter-spacing="1.8" fill="#ff8a1f">MODULE 03 · 55 MIN · LAB: lab3-weather-server</text>
 <text x="38" y="102" font-family="Creepster, 'Chalkboard SE', Impact, fantasy" font-size="46" letter-spacing="1" fill="#efe3cc" filter="url(#b3-tg)">Build</text>
 <text x="40" y="134" font-size="17" fill="#d8cfc0">The model never sees your code. It reads your words.</text>
 <text x="40" y="156" font-size="17" fill="#d8cfc0">Write them well and it <tspan fill="#ffd1a3" font-weight="700">picks your tool by itself.</tspan></text>
