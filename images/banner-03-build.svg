  @keyframes b3-flow { to { stroke-dashoffset: -20; } }
  @keyframes b3-blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .b3-tw, .b3-fly, .b3-flk, .b3-ln, .b3-seg, .b3-card, .b3-arrow, .b3-caret { animation: none !important; } }
