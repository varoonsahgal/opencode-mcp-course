<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Three MCP primitives, told apart by who pulls the trigger: tools, resources, prompts" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Three primitives, told apart by who pulls the trigger</title>
  <rect width="960" height="360" rx="18" fill="#fbfbfd"/>
  <text x="32" y="40" font-size="22" font-weight="700" fill="#0f172a">Three primitives, told apart by who pulls the trigger</text>
  <text x="32" y="61" font-size="13.5" fill="#475569">Same server, same JSON-RPC wire format. The difference is who decides to use each one.</text>

  <!-- TOOLS -->
  <g transform="translate(32 76)">
    <rect width="288" height="220" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="14" y="28" font-size="13" font-weight="800" fill="#3730a3">TOOLS <tspan font-weight="500">· the model</tspan> DOES</text>
    <g transform="translate(244 6)">
      <path d="M13 1 C6 1 3 8 3 14 L3 29 L7 25 L10 29 L13 25 L16 29 L19 25 L23 29 L23 14 C23 8 20 1 13 1 Z" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
      <circle cx="9.5" cy="12" r="1.8" fill="#4f46e5"/><circle cx="16.5" cy="12" r="1.8" fill="#4f46e5"/>
    </g>
    <text x="257" y="47" text-anchor="middle" font-size="10" fill="#64748b">the model</text>
    <line x1="14" y1="54" x2="274" y2="54" stroke="#4f46e5" stroke-opacity=".25"/>
    <g font-size="11.5" fill="#334155">
      <text x="14" y="74"><tspan font-weight="700" fill="#3730a3">Model-controlled:</tspan> the LLM reads the</text>
      <text x="14" y="90">name + description + schema and</text>
      <text x="14" y="106">decides to call it.</text>
      <text x="14" y="130"><tspan font-weight="700">In OpenCode:</tspan> the tool list, shown as</text>
      <text x="14" y="146" font-family="Menlo, 'JetBrains Mono', monospace" font-size="11" fill="#3730a3">⚙ server_tool […]</text>
    </g>
    <rect x="14" y="172" width="260" height="36" rx="8" fill="#e0e7ff"/>
    <g text-anchor="middle" font-family="Menlo, 'JetBrains Mono', monospace" font-size="11" fill="#3730a3">
      <text x="144" y="187">time_get_current_time</text>
      <text x="144" y="202">run_sql</text>
    </g>
  </g>

  <!-- RESOURCES -->
  <g transform="translate(336 76)">
    <rect width="288" height="220" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="14" y="28" font-size="13" font-weight="800" fill="#134e4a">RESOURCES <tspan font-weight="500">· the app</tspan> SHOWS</text>
    <g transform="translate(246 6)" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-linejoin="round">
      <path d="M3 2 H16 L23 9 V29 H3 Z" fill="#ffffff"/>
      <path d="M16 2 V9 H23"/>
      <path d="M7 14 H19 M7 18 H19 M7 22 H15" stroke-width="1.2"/>
    </g>
    <text x="259" y="47" text-anchor="middle" font-size="10" fill="#64748b">the app</text>
    <line x1="14" y1="54" x2="274" y2="54" stroke="#0f766e" stroke-opacity=".25"/>
    <g font-size="11.5" fill="#334155">
      <text x="14" y="74"><tspan font-weight="700" fill="#134e4a">Application/user-controlled:</tspan> read-only</text>
      <text x="14" y="90">context behind a URI; attached, not</text>
      <text x="14" y="106">executed.</text>
      <text x="14" y="130"><tspan font-weight="700">In OpenCode:</tspan> the @ picker (and the</text>
      <text x="14" y="146"><tspan font-family="Menlo, 'JetBrains Mono', monospace" font-size="11" fill="#134e4a">read_mcp_resource</tspan> tool, so the model</text>
      <text x="14" y="162">can also fetch one)</text>
    </g>
    <rect x="14" y="172" width="260" height="36" rx="8" fill="#ccfbf1"/>
    <g text-anchor="middle" font-family="Menlo, 'JetBrains Mono', monospace" font-size="11" fill="#134e4a">
      <text x="144" y="187">runbook://checkout</text>
      <text x="144" y="202">weather://wmo-codes</text>
    </g>
  </g>

  <!-- PROMPTS -->
  <g transform="translate(640 76)">
    <rect width="288" height="220" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="14" y="28" font-size="13" font-weight="800" fill="#9a3412">PROMPTS <tspan font-weight="500">· the user</tspan> SAYS</text>
    <g transform="translate(244 6)">
      <path d="M5 2 H26 A3 3 0 0 1 29 5 V19 A3 3 0 0 1 26 22 H13 L7 28 V22 H5 A3 3 0 0 1 2 19 V5 A3 3 0 0 1 5 2 Z" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="15.5" y="17" text-anchor="middle" font-size="13" font-weight="700" fill="#ea580c" font-family="Menlo, 'JetBrains Mono', monospace">/</text>
    </g>
    <text x="259" y="47" text-anchor="middle" font-size="10" fill="#64748b">the user</text>
    <line x1="14" y1="54" x2="274" y2="54" stroke="#ea580c" stroke-opacity=".25"/>
    <g font-size="11.5" fill="#334155">
      <text x="14" y="74"><tspan font-weight="700" fill="#9a3412">User-controlled:</tspan> a reusable message</text>
      <text x="14" y="90">template a human invokes on purpose.</text>
      <text x="14" y="130"><tspan font-weight="700">In OpenCode:</tspan> a slash command</text>
      <text x="14" y="146" font-family="Menlo, 'JetBrains Mono', monospace" font-size="11" fill="#9a3412">/server:prompt:mcp</text>
    </g>
    <rect x="14" y="172" width="260" height="36" rx="8" fill="#ffedd5"/>
    <text x="144" y="194" text-anchor="middle" font-family="Menlo, 'JetBrains Mono', monospace" font-size="11" fill="#9a3412">/weather:trip-briefing:mcp</text>
  </g>

  <rect x="32" y="308" width="896" height="38" rx="10" fill="#f1f5f9"/>
  <text x="480" y="332" text-anchor="middle" font-size="13" fill="#334155"><tspan font-weight="800" fill="#4f46e5">does</tspan> · <tspan font-weight="800" fill="#0f766e">shows</tspan> · <tspan font-weight="800" fill="#ea580c">says</tspan> — if you can say who decided, you know which primitive it is.</text>
</svg>
