  .b2-healstroke { animation: b2-flow 1.4s linear infinite, b2-healstroke 6s ease-in-out infinite; }
  .b2-bar1 { animation: b2-grow 6s ease-out infinite; transform-box: fill-box; transform-origin: left; }
  @keyframes b2-tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
  @keyframes b2-fly { 0%,100% { transform: translate(0,0) rotate(0); } 50% { transform: translate(12px,-7px) rotate(-8deg); } }
  @keyframes b2-flk { 0%,64% { opacity: 1; } 65%,70% { opacity: .3; } 71%,78% { opacity: 1; } 79%,82% { opacity: .4; } 83%,100% { opacity: 1; } }
  @keyframes b2-flow { to { stroke-dashoffset: -26; } }
  @keyframes b2-heal { 0%,45% { stroke: #e11d48; fill: #2a0d16; } 55%,100% { stroke: #7cf29a; fill: #0f1a2a; } }
  @keyframes b2-hface { 0%,45% { fill: #e11d48; } 55%,100% { fill: #ffe9b3; } }
  @keyframes b2-healtext { 0% { opacity: 0; } 50% { opacity: 1; } }
  @keyframes b2-broketext { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes b2-healstroke { 0%,45% { stroke: #e11d48; } 55%,100% { stroke: #7cf29a; } }
  @keyframes b2-grow { 0%,50% { transform: scaleX(.25); } 70%,100% { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .b2-tw, .b2-fly, .b2-flk, .b2-flow, .b2-heal, .b2-hface, .b2-healtext, .b2-broketext, .b2-healstroke, .b2-bar1 { animation: none !important; } }
 </style>
