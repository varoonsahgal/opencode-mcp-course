<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Module 2, Configure: one config file decides which servers start, what they can see, and what it costs you every turn">
 <title>Module 2 · Configure</title>
 <style>
  .b2-tw { animation: b2-tw 3.2s ease-in-out infinite; }
  .b2-fly { animation: b2-fly 6s ease-in-out infinite; }
