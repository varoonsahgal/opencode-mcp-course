<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A gateway between agents and MCP servers. Agents hold only a gateway token. Each call passes authentication, the policy check including argument rules, and the quarantine check on the way in; the upstream is called with a trace id; the result is redacted on the way out; every decision is written to the audit log. Upstream credentials live only in the gateway.">
  <defs>
    <marker id="ga-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="ga-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="ga-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="960" height="470" rx="18" fill="#fbfbfd"/>
  <text x="32" y="40" font-size="22" font-weight="700" fill="#0f172a">One door: what happens to every call</text>
  <text x="32" y="64" font-size="14" fill="#475569">The gateway is a server to the agents and a client to the upstreams. Everything company-wide lives in the middle box.</text>

  <!-- agents -->
  <g font-size="13">
    <rect x="28" y="100" width="150" height="60" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="103" y="124" text-anchor="middle" font-weight="700" fill="#3730a3">OpenCode (alice)</text><text x="103" y="144" text-anchor="middle" fill="#4f46e5" font-size="11.5">Bearer alice-dev-token</text>
    <rect x="28" y="182" width="150" height="60" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="103" y="206" text-anchor="middle" font-weight="700" fill="#3730a3">gw.ts (bob)</text><text x="103" y="226" text-anchor="middle" fill="#4f46e5" font-size="11.5">Bearer bob-releaser-token</text>
    <rect x="28" y="264" width="150" height="60" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="103" y="288" text-anchor="middle" font-weight="700" fill="#3730a3">any host (carol)</text><text x="103" y="308" text-anchor="middle" fill="#4f46e5" font-size="11.5">Bearer carol-lead-token</text>
    <text x="103" y="350" text-anchor="middle" fill="#64748b" font-size="11.5">no upstream credentials</text>
    <text x="103" y="365" text-anchor="middle" fill="#64748b" font-size="11.5">on any laptop</text>
  </g>

  <!-- gateway -->
  <rect x="220" y="86" width="500" height="320" rx="18" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
  <text x="240" y="112" font-size="15" font-weight="800" fill="#14532d">gateway.ts</text>
  <text x="700" y="112" text-anchor="end" font-size="12" fill="#15803d">policy.json · pins.json · audit.jsonl</text>
  <g font-size="12.5">
    <text x="240" y="138" font-weight="700" fill="#14532d">on the way in</text>
    <rect x="240" y="148" width="140" height="62" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><text x="310" y="170" text-anchor="middle" font-weight="700" fill="#14532d">authenticate</text><text x="310" y="188" text-anchor="middle" fill="#475569" font-size="11.5">token → person,</text><text x="310" y="202" text-anchor="middle" fill="#475569" font-size="11.5">groups</text>
    <rect x="400" y="148" width="140" height="62" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><text x="470" y="170" text-anchor="middle" font-weight="700" fill="#14532d">TODO 1 · policy</text><text x="470" y="188" text-anchor="middle" fill="#475569" font-size="11.5">tool globs, groups,</text><text x="470" y="202" text-anchor="middle" fill="#475569" font-size="11.5">argument regexes</text>
    <rect x="560" y="148" width="140" height="62" rx="10" fill="#fff" stroke="#7e22ce" stroke-width="1.5"/><text x="630" y="170" text-anchor="middle" font-weight="700" fill="#6b21a8">TODO 2 · quarantine</text><text x="630" y="188" text-anchor="middle" fill="#475569" font-size="11.5">poisoned or changed</text><text x="630" y="202" text-anchor="middle" fill="#475569" font-size="11.5">definitions hidden</text>
    <line x1="380" y1="179" x2="398" y2="179" stroke="#15803d" stroke-width="2" marker-end="url(#ga-a)"/><line x1="540" y1="179" x2="558" y2="179" stroke="#15803d" stroke-width="2" marker-end="url(#ga-a)"/>

    <text x="240" y="244" font-weight="700" fill="#14532d">on the way out</text>
    <rect x="400" y="254" width="140" height="62" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.5"/><text x="470" y="276" text-anchor="middle" font-weight="700" fill="#9a3412">TODO 3 · redact</text><text x="470" y="294" text-anchor="middle" fill="#475569" font-size="11.5">secrets for all,</text><text x="470" y="308" text-anchor="middle" fill="#475569" font-size="11.5">e-mails unless lead</text>
    <rect x="240" y="254" width="140" height="62" rx="10" fill="#fff" stroke="#475569" stroke-width="1.5"/><text x="310" y="276" text-anchor="middle" font-weight="700" fill="#334155">TODO 4 · audit</text><text x="310" y="294" text-anchor="middle" fill="#475569" font-size="11.5">who, what, why,</text><text x="310" y="308" text-anchor="middle" fill="#475569" font-size="11.5">ms, bytes, trace id</text>
    <rect x="560" y="254" width="140" height="62" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><text x="630" y="276" text-anchor="middle" font-weight="700" fill="#14532d">call upstream</text><text x="630" y="294" text-anchor="middle" fill="#475569" font-size="11.5">_meta.traceparent</text><text x="630" y="308" text-anchor="middle" fill="#475569" font-size="11.5">(SEP-414)</text>
    <line x1="630" y1="212" x2="630" y2="252" stroke="#15803d" stroke-width="2" marker-end="url(#ga-a)"/>
    <line x1="558" y1="285" x2="542" y2="285" stroke="#b45309" stroke-width="2" marker-end="url(#ga-b)"/><line x1="398" y1="285" x2="382" y2="285" stroke="#b45309" stroke-width="2" marker-end="url(#ga-b)"/>
    <rect x="240" y="336" width="460" height="52" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="470" y="358" text-anchor="middle" font-weight="700" fill="#9f1239">what it cannot do: make a read-write credential read-only</text>
    <text x="470" y="376" text-anchor="middle" fill="#9f1239" font-size="11.5">an argument rule is a speed bump; ring 1 (the upstream's own credential) is the lock</text>
  </g>

  <!-- upstreams -->
  <g font-size="13">
    <rect x="770" y="100" width="164" height="54" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/><text x="852" y="122" text-anchor="middle" font-weight="700" fill="#9a3412">teamdb</text><text x="852" y="141" text-anchor="middle" fill="#9a3412" font-size="11">its admin token lives here</text>
    <rect x="770" y="170" width="164" height="54" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/><text x="852" y="192" text-anchor="middle" font-weight="700" fill="#9a3412">itdesk</text><text x="852" y="211" text-anchor="middle" fill="#9a3412" font-size="11">asks; the gateway can't</text>
    <rect x="770" y="240" width="164" height="54" rx="12" fill="#f5f3ff" stroke="#7e22ce" stroke-width="2" stroke-dasharray="6 4"/><text x="852" y="262" text-anchor="middle" font-weight="700" fill="#6b21a8">notes</text><text x="852" y="281" text-anchor="middle" fill="#6b21a8" font-size="11">poisoned: quarantined</text>
    <rect x="770" y="310" width="164" height="54" rx="12" fill="#f5f3ff" stroke="#7e22ce" stroke-width="2" stroke-dasharray="6 4"/><text x="852" y="332" text-anchor="middle" font-weight="700" fill="#6b21a8">release</text><text x="852" y="351" text-anchor="middle" fill="#6b21a8" font-size="11">rug pull: quarantined</text>
  </g>
  <g fill="none" stroke-width="2">
    <line x1="178" y1="130" x2="238" y2="170" stroke="#94a3b8" marker-end="url(#ga-c)"/>
    <line x1="178" y1="212" x2="238" y2="186" stroke="#94a3b8" marker-end="url(#ga-c)"/>
    <line x1="178" y1="294" x2="238" y2="200" stroke="#94a3b8" marker-end="url(#ga-c)"/>
    <line x1="722" y1="127" x2="768" y2="127" stroke="#15803d" marker-end="url(#ga-a)"/>
    <line x1="722" y1="197" x2="768" y2="197" stroke="#15803d" marker-end="url(#ga-a)"/>
    <line x1="722" y1="267" x2="768" y2="267" stroke="#c084fc" stroke-dasharray="3 5"/>
    <line x1="722" y1="337" x2="768" y2="337" stroke="#c084fc" stroke-dasharray="3 5"/>
  </g>
  <text x="480" y="440" text-anchor="middle" font-size="12" fill="#475569">Change policy.json once and every agent in the company is under the new rule on its next call. That is the whole case for a gateway.</text>
</svg>
