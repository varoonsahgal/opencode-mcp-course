 <path d="M960,220L892.5,198.1M960,220L902.6,178.3M960,220L918.3,162.6M960,220L938.1,152.5M943.0,220.0Q944.9,217.6 943.8,214.7Q946.4,213.1 946.2,210.0Q949.2,209.2 950.0,206.2Q953.1,206.4 954.7,203.8Q957.6,204.9 960.0,203.0M927.0,220.0Q930.7,215.4 928.6,209.8Q933.5,206.5 933.3,200.6Q939.0,199.0 940.6,193.3Q946.5,193.5 949.8,188.6Q955.4,190.7 960.0,187.0M911.0,220.0Q916.4,213.1 913.4,204.9Q920.7,200.0 920.4,191.2Q928.8,188.8 931.2,180.4Q940.0,180.7 944.9,173.4Q953.1,176.4 960.0,171.0M895.0,220.0Q902.2,210.8 898.2,199.9Q907.9,193.4 907.4,181.8Q918.6,178.6 921.8,167.4Q933.4,167.9 939.9,158.2Q950.8,162.2 960.0,155.0" fill="none" stroke="#efe3cc" stroke-opacity=".25" stroke-width=".8"/>

 <!-- left: words -->
 <text x="40" y="50" font-family="Menlo, 'JetBrains Mono', monospace" font-size="12" letter-spacing="2.5" fill="#a855f7">MODULE 01 · 40 MIN · LAB: lab1-first-contact</text>
 <text x="38" y="102" font-family="Creepster, 'Chalkboard SE', Impact, fantasy" font-size="46" letter-spacing="1" fill="#efe3cc" filter="url(#b1-tg)">Connect</text>
 <text x="40" y="134" font-size="17" fill="#d8cfc0">Give an agent hands. Then read every word</text>
 <text x="40" y="156" font-size="17" fill="#d8cfc0">it says to them, <tspan fill="#d8b4fe" font-weight="700">byte for byte.</tspan></text>
 <g font-weight="700">
  <rect x="40" y="176" width="136" height="26" rx="13" fill="#a855f7" fill-opacity=".18" stroke="#a855f7"/><text x="108" y="193" text-anchor="middle" fill="#d8b4fe" font-size="11.5">2 servers connected</text>
  <rect x="184" y="176" width="150" height="26" rx="13" fill="#a855f7" fill-opacity=".18" stroke="#a855f7"/><text x="259" y="193" text-anchor="middle" fill="#d8b4fe" font-size="11.5">3 primitives touched</text>
  <rect x="342" y="176" width="134" height="26" rx="13" fill="#a855f7" fill-opacity=".18" stroke="#a855f7"/><text x="409" y="193" text-anchor="middle" fill="#d8b4fe" font-size="11.5">1 protocol, wiretapped</text>
 </g>

