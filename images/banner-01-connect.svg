<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Module 1, Connect: JSON-RPC messages crossing the wire between OpenCode and an MCP server">
 <title>Module 1 · Connect</title>
 <style>
  .b1-tw { animation: b1-tw 3.2s ease-in-out infinite; }
  .b1-fly { animation: b1-fly 6s ease-in-out infinite; }
  .b1-flk { animation: b1-flk 3.1s steps(1) infinite; }
  .b1-out { animation: b1-out 4.5s linear infinite; opacity: 0; }
  .b1-back { animation: b1-back 4.5s linear infinite; opacity: 0; }
  .b1-d1 { animation-delay: -1.5s; } .b1-d2 { animation-delay: -3s; }
  .b1-out.b1-d2 { opacity: 1; transform: translateX(103px); }
  .b1-back.b1-d2 { opacity: 1; transform: translateX(-103px); }
  .b1-wire { stroke-dasharray: 3 7; animation: b1-flow 1.2s linear infinite; }
  .b1-rev { animation-direction: reverse; }
  .b1-halo { animation: b1-halo 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes b1-tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
  @keyframes b1-fly { 0%,100% { transform: translate(0,0) rotate(0); } 50% { transform: translate(12px,-7px) rotate(-8deg); } }
  @keyframes b1-flk { 0%,64% { opacity: 1; } 65%,70% { opacity: .3; } 71%,78% { opacity: 1; } 79%,82% { opacity: .4; } 83%,100% { opacity: 1; } }
  @keyframes b1-out  { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 42% { transform: translateX(206px); opacity: 1; } 48%,100% { transform: translateX(206px); opacity: 0; } }
  @keyframes b1-back { 0%,40% { transform: translateX(0); opacity: 0; } 48% { opacity: 1; } 84% { transform: translateX(-206px); opacity: 1; } 90%,100% { transform: translateX(-206px); opacity: 0; } }
  @keyframes b1-flow { to { stroke-dashoffset: -20; } }
  @keyframes b1-halo { 0% { opacity: .5; transform: scale(.95); } 100% { opacity: 0; transform: scale(1.35); } }
  @media (prefers-reduced-motion: reduce) { .b1-tw, .b1-fly, .b1-flk, .b1-out, .b1-back, .b1-wire, .b1-halo { animation: none !important; } }
 </style>
 <defs>
