  <path class="b1-wire b1-rev" d="M640 136 H846" stroke="#7cf29a" opacity=".8"/>
 </g>
 <g font-family="Menlo, 'JetBrains Mono', monospace" font-size="10" fill="#8b7fa3" text-anchor="middle">
  <text x="743" y="80">client → server</text>
  <text x="743" y="158">server → client</text>
 </g>
 <g font-family="Menlo, 'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">
  <g class="b1-out">    <rect x="602" y="82" width="76" height="20" rx="10" fill="#7e22ce"/><text x="640" y="96">initialize</text></g>
  <g class="b1-out b1-d1"> <rect x="602" y="82" width="76" height="20" rx="10" fill="#7e22ce"/><text x="640" y="96">tools/list</text></g>
  <g class="b1-out b1-d2"> <rect x="602" y="82" width="76" height="20" rx="10" fill="#a855f7"/><text x="640" y="96">tools/call</text></g>
  <g class="b1-back">    <rect x="808" y="126" width="76" height="20" rx="10" fill="#15803d"/><text x="846" y="140">✓ result</text></g>
  <g class="b1-back b1-d1"> <rect x="808" y="126" width="76" height="20" rx="10" fill="#15803d"/><text x="846" y="140">✓ 2 tools</text></g>
  <g class="b1-back b1-d2"> <rect x="808" y="126" width="76" height="20" rx="10" fill="#15803d"/><text x="846" y="140">✓ 14:31</text></g>
 </g>

