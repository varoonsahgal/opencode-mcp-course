<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Three-panel comic: the IT desk ghost asks which keyboard Dana wants; in OpenCode nobody answers and the terminal says Method not found; a skeleton at their own host answers DE; the ghost hands over a ticket and explains that the host answered, not the model.">
<title>Panel 1, OpenCode: the IT desk ghost asks "Which keyboard does Dana want?" The OpenCode terminal answers: -32601 Method not found. Ghost: Is anybody there? Panel 2, your host: the ghost asks the same question; a skeleton at a terminal types DE. Panel 3: the ghost holds ticket ITD-1042. Skeleton: Did the model see my answer? Ghost: No. The host did. Caption: A server can only ask. Somebody has to be there to answer, and that somebody is the host.</title>
