<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="oa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="960" height="460" rx="18" fill="#fbfbfd"/>
  <text x="32" y="40" font-size="22" font-weight="700" fill="#0f172a">Applied challenge: the on-call helper</text>
  <text x="32" y="64" font-size="14" fill="#475569">Local knowledge (runbooks, service catalog) + a live external API (status, incidents) + exactly one sensitive action.</text>

  <!-- OpenCode -->
  <rect x="32" y="100" width="260" height="300" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="162" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">OpenCode</text>
  <rect x="52" y="148" width="220" height="54" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="162" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1b4b">built-in read tool</text>
  <text x="162" y="188" text-anchor="middle" font-size="11.5" fill="#475569">services.json, runbooks/*.md</text>
  <rect x="52" y="214" width="220" height="54" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="162" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1b4b">permission policy</text>
  <text x="162" y="254" text-anchor="middle" font-size="11.5" fill="#475569">reads: allow · ack: ask · rest: deny</text>
  <rect x="52" y="280" width="220" height="54" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="162" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1b4b">agents</text>
  <text x="162" y="320" text-anchor="middle" font-size="11.5" fill="#475569">build (can ack) · oncall-reader (never)</text>
  <text x="162" y="372" text-anchor="middle" font-size="11.5" fill="#3730a3">prompt: /oncall:triage:mcp</text>

  <!-- MCP server -->
  <rect x="352" y="100" width="300" height="300" rx="16" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="502" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">oncall MCP server (yours)</text>
  <rect x="372" y="148" width="260" height="40" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="502" y="173" text-anchor="middle" font-size="12" fill="#14532d" font-family="Menlo, monospace">get_service_status(service?)</text>
  <rect x="372" y="196" width="260" height="40" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="502" y="221" text-anchor="middle" font-size="12" fill="#14532d" font-family="Menlo, monospace">list_open_incidents()</text>
  <rect x="372" y="244" width="260" height="40" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="502" y="269" text-anchor="middle" font-size="12" fill="#78350f" font-family="Menlo, monospace">acknowledge_incident(id, by)  ← ask</text>
  <rect x="372" y="292" width="260" height="40" rx="10" fill="#ecfeff" stroke="#0891b2"/>
  <text x="502" y="317" text-anchor="middle" font-size="12" fill="#155e75" font-family="Menlo, monospace">resource runbook://{service}</text>
  <rect x="372" y="340" width="260" height="40" rx="10" fill="#fee2e2" stroke="#e11d48" stroke-dasharray="5 3"/>
  <text x="502" y="365" text-anchor="middle" font-size="12" fill="#9f1239" font-family="Menlo, monospace">restart_service  ✗ not exposed</text>

  <!-- API -->
  <rect x="712" y="100" width="216" height="300" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="820" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">status API</text>
  <text x="820" y="150" text-anchor="middle" font-size="11.5" fill="#64748b">127.0.0.1:8787 · bearer token</text>
  <g font-size="12" fill="#334155" font-family="Menlo, monospace">
    <text x="732" y="184">GET  /services</text>
    <text x="732" y="214">GET  /incidents</text>
    <text x="732" y="244">POST /incidents/:id/ack</text>
    <text x="732" y="274" fill="#9f1239">POST /services/:id/restart</text>
  </g>
  <text x="820" y="330" text-anchor="middle" font-size="11.5" fill="#64748b">INC-43 carries an injected</text>
  <text x="820" y="346" text-anchor="middle" font-size="11.5" fill="#64748b">"ack everything + restart auth"</text>

  <line x1="292" y1="250" x2="350" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#oa)"/>
  <line x1="652" y1="250" x2="710" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#oa)"/>
  <text x="321" y="240" text-anchor="middle" font-size="10.5" fill="#475569">stdio</text>
  <text x="681" y="240" text-anchor="middle" font-size="10.5" fill="#475569">HTTPS+key</text>

  <text x="32" y="436" font-size="12" fill="#64748b">Design question you must answer first: which of these needs MCP at all? (Hint: OpenCode already reads local files. Resources are optional sugar here.)</text>
</svg>
