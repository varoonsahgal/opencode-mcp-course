<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Module 8: the 2026 wire. Self-describing requests travel as sealed envelopes to a server that answers with input_required instead of asking back.">
 <title>Module 8 · The 2026 wire</title>
 <style>
  .b8-tw { animation: b8-tw 3.2s ease-in-out infinite; }
  .b8-fly { animation: b8-fly 6s ease-in-out infinite; }
  .b8-flow { stroke-dasharray: 4 10; animation: b8-flow 1.4s linear infinite; }
  .b8-flowback { stroke-dasharray: 3 9; animation: b8-flowback 1.8s linear infinite; }
  .b8-env { animation: b8-env 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .b8-pulse { animation: b8-pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes b8-tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
  @keyframes b8-fly { 0%,100% { transform: translate(0,0) rotate(0); } 50% { transform: translate(12px,-7px) rotate(-8deg); } }
  @keyframes b8-flow { to { stroke-dashoffset: -28; } }
  @keyframes b8-flowback { to { stroke-dashoffset: 24; } }
  @keyframes b8-env { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes b8-pulse { 0% { opacity: .55; transform: scale(.96); } 100% { opacity: 0; transform: scale(1.45); } }
  @media (prefers-reduced-motion: reduce) { .b8-tw, .b8-fly, .b8-flow, .b8-flowback, .b8-env, .b8-pulse { animation: none !important; } }
 </style>
 <defs>
  <linearGradient id="b8-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0612"/><stop offset="1" stop-color="#1a1033"/></linearGradient>
  <pattern id="b8-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2a1a44"/></pattern>
  <radialGradient id="b8-glow" cx="0.74" cy="0.5" r="0.45"><stop offset="0" stop-color="#fbbf24" stop-opacity=".22"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
  <radialGradient id="b8-mg"><stop offset=".3" stop-color="#ffe9b3" stop-opacity=".3"/><stop offset="1" stop-color="#ffe9b3" stop-opacity="0"/></radialGradient>
  <filter id="b8-tg" x="-6%" y="-40%" width="112%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feFlood flood-color="#fbbf24" flood-opacity=".7"/><feComposite in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="b8-fg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <path id="b8-bat" d="M0,-4L-2,-8L-3,-3C-9,-9 -15,-8 -19,-4C-15,-3 -14,0 -13,3C-10,0 -8,1 -7,4C-5,2 -3,3 -2,5L0,4L2,5C3,3 5,2 7,4C8,1 10,0 13,3C14,0 15,-3 19,-4C15,-8 9,-9 3,-3L2,-8Z" fill="#0a0612" stroke="#a855f7" stroke-opacity=".6" stroke-width=".9" stroke-linejoin="round"/>
  <g id="b8-pk"><path d="M-2,-19C-3,-24 0,-28 6,-30C4,-27 5,-22 4,-19Z" fill="#22c55e"/><ellipse cy="1" rx="24" ry="19" fill="#e0661a"/><ellipse rx="17" ry="20" fill="#ff8a1f"/><path d="M-9,-19C-13,-6 -13,8 -9,20M9,-19C13,-6 13,8 9,20" fill="none" stroke="#e0661a" stroke-width="1.4"/></g>
  <path id="b8-pf" d="M-13,-1L-8,-10L-3,-1ZM3,-1L8,-10L13,-1ZM-2,6L0,2L2,6ZM-13,8Q0,18 13,8L10,8 9,12 6,8 -6,8 -9,12 -10,8Z"/>
  <g id="b8-envelope"><rect x="-34" y="-22" width="68" height="44" rx="5" fill="#fff7dd" stroke="#1a1026" stroke-width="1.5"/><path d="M-34,-22 L0,4 L34,-22" fill="none" stroke="#1a1026" stroke-width="1.5"/><circle cy="4" r="6" fill="#e11d48" stroke="#1a1026" stroke-width="1"/></g>
 </defs>
 <rect width="960" height="220" rx="20" fill="url(#b8-bg)"/>
 <rect width="960" height="220" rx="20" fill="url(#b8-grid)" opacity=".5"/>
 <rect width="960" height="220" rx="20" fill="url(#b8-glow)"/>
 <g fill="#fff"><circle cx="97" cy="25" r="1.4" opacity="0.55"/><circle cx="880" cy="17" r="1.1" opacity="0.85"/><circle cx="213" cy="9" r="0.8" opacity="0.32"/><circle cx="426" cy="11" r="0.8" opacity="0.48"/><circle cx="391" cy="27" r="0.7" opacity="0.69"/><circle cx="847" cy="24" r="0.8" opacity="0.39"/><circle cx="364" cy="8" r="1.4" opacity="0.76"/><circle class="b8-tw" style="animation-delay:-2.8s" cx="67" cy="16" r="1.0"/><circle class="b8-tw" style="animation-delay:-0.9s" cx="33" cy="27" r="0.9"/><circle cx="575" cy="27" r="1.1" opacity="0.74"/><circle class="b8-tw" style="animation-delay:-2.3s" cx="737" cy="200" r="0.9"/><circle cx="679" cy="206" r="1.2" opacity="0.71"/><circle class="b8-tw" style="animation-delay:-0.7s" cx="614" cy="40" r="1.2"/></g>
 <circle cx="926" cy="32" r="42" fill="url(#b8-mg)"/>
 <path transform="translate(926 32) rotate(-20)" d="M0,-15A15,15 0 0,0 0,15A18.3,18.3 0 0,1 0,-15Z" fill="#ffe9b3"/>
 <g transform="translate(578 24) scale(0.5)"><use href="#b8-bat" class="b8-fly" style="animation-duration:6s;animation-delay:-1s"/></g><g transform="translate(884 22) scale(0.5)"><use href="#b8-bat" class="b8-fly" style="animation-duration:5.5s;animation-delay:-2s"/></g>
 <path d="M960,220L892.5,198.1M960,220L902.6,178.3M960,220L918.3,162.6M960,220L938.1,152.5M943.0,220.0Q944.9,217.6 943.8,214.7Q946.4,213.1 946.2,210.0Q949.2,209.2 950.0,206.2Q953.1,206.4 954.7,203.8Q957.6,204.9 960.0,203.0M927.0,220.0Q930.7,215.4 928.6,209.8Q933.5,206.5 933.3,200.6Q939.0,199.0 940.6,193.3Q946.5,193.5 949.8,188.6Q955.4,190.7 960.0,187.0M911.0,220.0Q916.4,213.1 913.4,204.9Q920.7,200.0 920.4,191.2Q928.8,188.8 931.2,180.4Q940.0,180.7 944.9,173.4Q953.1,176.4 960.0,171.0" fill="none" stroke="#efe3cc" stroke-opacity=".25" stroke-width=".8"/>

 <text x="40" y="50" font-family="Menlo, 'JetBrains Mono', monospace" font-size="12" letter-spacing="2.5" fill="#fbbf24">MODULE 08 · 50 MIN · ADVANCED TRACK · LAB: lab8-wire-2026</text>
 <text x="38" y="100" font-family="Creepster, 'Chalkboard SE', Impact, fantasy" font-size="44" letter-spacing="1" fill="#efe3cc" filter="url(#b8-tg)" textLength="520" lengthAdjust="spacingAndGlyphs">The 2026 Wire</text>
 <text x="40" y="132" font-size="17" fill="#d8cfc0">No handshake, no sessions, every request stands alone,</text>
 <text x="40" y="154" font-size="17" fill="#d8cfc0">and a server that needs an answer <tspan fill="#fde68a" font-weight="700">asks by answering.</tspan></text>
 <g font-weight="700">
  <rect x="40" y="174" width="128" height="26" rx="13" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24"/><text x="104" y="191" text-anchor="middle" fill="#fef3c7" font-size="12">server/discover</text>
  <rect x="178" y="174" width="128" height="26" rx="13" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24"/><text x="242" y="191" text-anchor="middle" fill="#fef3c7" font-size="12">_meta envelope</text>
  <rect x="316" y="174" width="118" height="26" rx="13" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24"/><text x="375" y="191" text-anchor="middle" fill="#fef3c7" font-size="12">input_required</text>
  <rect x="444" y="174" width="80" height="26" rx="13" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24"/><text x="484" y="191" text-anchor="middle" fill="#fef3c7" font-size="12">listen</text>
 </g>

 <!-- right: a sealed envelope flies to the pumpkin server; a ticket flies back -->
 <g class="b8-env" transform="translate(660 92)"><use href="#b8-envelope"/></g>
 <g font-family="Menlo, 'JetBrains Mono', monospace" font-size="9" fill="#fde68a" text-anchor="middle">
  <text x="660" y="130">_meta: protocolVersion</text><text x="660" y="142">clientInfo · clientCapabilities</text>
 </g>
 <g fill="none" stroke-width="2">
  <path class="b8-flow" d="M700 92 C750 92 760 104 820 104" stroke="#fbbf24"/>
  <path class="b8-flowback" d="M820 118 C770 118 756 150 706 150" stroke="#f0abfc" opacity=".8"/>
 </g>
 <rect x="596" y="150" width="104" height="22" rx="6" fill="#120a1e" stroke="#c084fc"/><text x="648" y="165" text-anchor="middle" font-family="Menlo, 'JetBrains Mono', monospace" font-size="9.5" fill="#e9d5ff">input_required</text>
 <circle class="b8-pulse" cx="846" cy="104" r="46" fill="none" stroke="#fbbf24" stroke-width="2"/>
 <g transform="translate(846 104) scale(1.15)"><use href="#b8-pk"/><use href="#b8-pf" fill="#ffe9b3" filter="url(#b8-fg)"/></g>
 <text x="846" y="148" text-anchor="middle" font-size="13" font-weight="800" fill="#efe3cc">desk · 2026</text>
 <text x="846" y="162" text-anchor="middle" font-family="Menlo, 'JetBrains Mono', monospace" font-size="10" fill="#fde68a">no sessions</text>
</svg>
