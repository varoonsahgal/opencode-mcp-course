<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Three-panel comic: the witch adds one environment variable, but the env-peek pumpkin server receives 83 because environment adds to what the server inherits.">
<title>Screen: "environment": { "DEPLOY_ENV": "classroom" }. Witch: There. One variable. [Dozens of variable tags fly into a pumpkin labelled env-peek: AWS_PROFILE, GITHUB_TOKEN, OPENAI_API_KEY, HOME, PATH, NPM_TOKEN, SSH_AUTH_SOCK…] Pumpkin: I got 83. Thanks! Witch: I said ONE. Pumpkin: You said add. Caption: environment adds to what a local server inherits. It never subtracts.</title>
