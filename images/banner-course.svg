<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="MCP with AI Agents: one host, many servers, every connection a decision">
 <title>MCP with AI Agents</title>
 <style>
  .bc-tw { animation: bc-tw 3.2s ease-in-out infinite; }
  .bc-fly { animation: bc-fly 6s ease-in-out infinite; }
  .bc-flk { animation: bc-flk 3.1s steps(1) infinite; }
  .bc-flow { stroke-dasharray: 4 10; animation: bc-flow 1.6s linear infinite; }
  .bc-slow { animation-duration: 2.4s; }
  .bc-pulse { animation: bc-pulse 2.4s ease-in-out infinite; }
  .bc-blink { animation: bc-blink 2.4s steps(1) infinite; }
  .bc-halo { animation: bc-halo 3.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes bc-tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
  @keyframes bc-fly { 0%,100% { transform: translate(0,0) rotate(0); } 50% { transform: translate(12px,-7px) rotate(-8deg); } }
  @keyframes bc-flk { 0%,64% { opacity: 1; } 65%,70% { opacity: .3; } 71%,78% { opacity: 1; } 79%,82% { opacity: .4; } 83%,100% { opacity: 1; } }
  @keyframes bc-flow { to { stroke-dashoffset: -28; } }
  @keyframes bc-pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes bc-blink { 0%,60% { opacity: 1; } 61%,100% { opacity: .25; } }
  @keyframes bc-halo { 0% { opacity: .5; transform: scale(.9); } 100% { opacity: 0; transform: scale(1.6); } }
  @media (prefers-reduced-motion: reduce) { .bc-tw, .bc-fly, .bc-flk, .bc-flow, .bc-pulse, .bc-blink, .bc-halo { animation: none !important; } }
 </style>
