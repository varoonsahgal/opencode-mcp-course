  <radialGradient id="bc-glow" cx="0.73" cy="0.5" r="0.45"><stop offset="0" stop-color="#ff8a1f" stop-opacity=".3"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></radialGradient>
